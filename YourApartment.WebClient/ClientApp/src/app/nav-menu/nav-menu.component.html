<div>
  <div class="header-container">
    <div class="logo-container">
      <a class="logo" [routerLink]="['/']">Your Apartment</a>
    </div>
    <div class="container-navigation-bar">
      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <a class="navigation-bar-item" [routerLink]="['/']">Acasa</a>
      </div>
      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
        [routerLinkActive]="['active-link']"
      >
        <a
          class="navigation-bar-item"
          [routerLink]="['/apartments-rent']"
          [routerLinkActive]="['active-link']"
          >Inchirieri</a
        >
      </div>

      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
      >
        <a
          class="navigation-bar-item"
          [routerLink]="['/perfect-home']"
          [routerLinkActive]="['active-link']"

          >Your perfect home
        </a>
      </div>
      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
      >
        <a
          class="navigation-bar-item"
          [routerLink]="['/my-account']"
          [routerLinkActive]="['active-link']"

          >Contul meu</a
        >
      </div>
      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
      >
        <a
          class="navigation-bar-item"
          [routerLink]="['/my-account']"
          (click)="logout()"
          >Log Out</a
        >
      </div>
      <div
        class="navigation-bar-item-container"
        [routerLinkActive]="['link-active']"
        [routerLinkActive]="['active-link']"
      >
        <a
          class="navigation-bar-item"
          [routerLink]="['/add-apartment']"
          [routerLinkActive]="['active-link']"

          >Adauga Anunt</a
        >
      </div>
    </div>
  </div>
</div>
