<form [formGroup]="apartmentForm" (ngSubmit)="onSubmit()">
  <div class="add-apartment-container">
    <div class="add-images-container">
      <div class="form-group">
        <label for="file">Choose File</label>
        <input
          class="form-control"
          type="file"
          (change)="onFileChanged($event)"
          formControlName="image"
          accept="image/jpg,image/jpeg"
        />
      </div>
    </div>
    <div class="add-location-container">
      <label>
        Adresa exacta:
        <input class="form-control" type="text" formControlName="exactAdress" />
      </label>
    </div>
    <div class="add-properties-container">
      <label>
        Titlu: *
        <input
          class="form-control"
          type="text"
          formControlName="title"
          required
        />
      </label>
      <div class="form-group">
        <label for="number-of-rooms"
          >Numarul de camere: *
          <input
            class="form-control"
            type="number"
            name="min-price"
            min="0"
            max="100"
            formControlName="numberOfRooms"
            required
          />
        </label>
      </div>
      <label>
        Suprafata Utila: *
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="0"
          formControlName="area"
          required
        />
      </label>

      <label>
        Descriere:
        <input class="form-control" type="text" formControlName="description" />
      </label>

      <label>
        Etaj:
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="0"
          formControlName="floor"
        />
      </label>

      <label>
        Numarul de etaje al cladirii:
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="0"
          formControlName="totalNumberOfFloors"
        />
      </label>

      <label>
        Numarul de bai:
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="0"
          formControlName="numberOfBathRooms"
        />
      </label>
      <label>
        Anul in care a fost contruita cladirea:
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="1920"
          max="2020"
          formControlName="constructionYear"
        />
      </label>
      <label>
        Nivelul de confort:
        <input
          class="form-control"
          type="number"
          name="min-price"
          min="1"
          max="10"
          formControlName="confort"
        />
      </label>
      <label>
        Numarul de telefon: *
        <input
          class="form-control"
          type="tel"
          formControlName="phone"
          required
        />
      </label>
      <label>
        Pret: *
        <input
          class="form-control"
          type="number"
          min="1"
          formControlName="price"
          required
        />
        <div class="corect-price-container">
          <button disabled>Check the Ideal Price</button>
        </div>
      </label>
    </div>
    <button type="submit" [disabled]="!apartmentForm.valid">Submit</button>
  </div>
</form>
<p>Form Status: {{ apartmentForm.status }}</p>
