<div class="apartments-rent-page-container">
  <div class="subheader-rent-apartments">
    <div class="search-bar-container">
      <div class="icon-search-container">
        <div class="icon-search"></div>
      </div>
      <div class="search-box">
        <label for="search-apartment"></label>
        <input type="text" id="search-apartment" name="search-apartment" />
      </div>
    </div>
    <div class="filters-bar-container">
      <div class="left-filters">
        <div class="filter-button">
          <div class="number-of-rooms-icon-blue"></div>
          <select class="filter-button">
            <option selected value="rent">Rent</option>
            <option value="buy">Buy</option>
          </select>
        </div>
        <div class="filter-button">
          <div class="number-of-rooms-icon-blue"></div>
          <select
            (change)="filterByRooms($event.target.value)"
            class="filter-button"
          >
            <option selected value="">Number of Rooms</option>
            <option value="1">1 Room</option>
            <option value="2">2 Rooms</option>
            <option value="3">3 Rooms</option>
            <option value="4">4 Rooms</option>
            <option value="5">5 or more Rooms</option>
          </select>
        </div>
        <div class="filter-button">
          <div class="icon-area-blue"></div>
          <select class="filter-button">
            <option selected value="">Area</option>
            <option value="200">200mp</option>
          </select>
        </div>
        <div class="filter-button">
          <div class="icon-price-blue"></div>
          <select class="filter-button">
            <option selected value="">Price</option>
            <option value="&lt200"> &lt; 200 Euro</option>
            <option value="200-250"> 200-250 Euro </option>
            <option value="250-300"> 250-300 Euro </option>
            <option value="300-350"> 300-350 Euro</option>
            <option value="350-400"> 350-400 Euro</option>
            <option value="400-450"> 400-450 Euro</option>
            <option value="450-500"> 450-500 Euro</option>
            <option value="&gt500"> &gt; 500 Euro</option>
          </select>
        </div>
        <div class="filter-button">
          <div class="location-icon"></div>
          <select aria-placeholder="Zone" class="filter-button">
            <option value="" selected>Zone</option>
            <option
              *ngFor="let location of locations"
              value="{{ location.id }}"
            >
              {{ location.name }}</option
            >
          </select>
        </div>
      </div>
      <div class="see-map-button">
        See Map
      </div>
    </div>
  </div>

  <div class="apartments-search-container">
    <div *ngIf="apartmentsPageModel" class="number-of-apartments">
      {{ apartmentsPageModel.totalNumberOfRecords }} Rezultate
    </div>
    <div class="apartments-list-container">
      <div class="apartment-card" *ngFor="let apartment of apartmentsList">
        <div class="image-card">
          <img
            mat-card-image
            [src]="'data:image/png;base64,' + apartment.images[0]"
            [alt]="apartment.name"
          />
        </div>
        <div class="card-details">
          <div class="card-price">{{ apartment.price }} EUR/month</div>
          <div class="card-adress">
            <div class="location-icon"></div>
            Iasi, Podu Ros, Bv Socola, Nr.10
          </div>
          <div class="apartment-details">
            <div class="card-number-of-rooms">
              <div class="number-of-rooms-icon"></div>
              {{ apartment.numberOfRooms }}
            </div>
            <div class="card-area">
              <div class="icon-area"></div>
              {{ apartment.area }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="pagination-controls-container">
      <mat-paginator
        class="paginator"
        *ngIf="apartmentsPageModel"
        [length]="this.apartmentsPageModel.totalNumberOfRecords"
        [pageSize]="this.pageSize"
        [pageSizeOptions]="[8, 16, 32]"
        (page)="paginateResults($event)"
      >
      </mat-paginator>
    </div>
  </div>
</div>
